[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cloudscale-cli"
dynamic = ["version"]
description = "Command line interface client for cloudscale.ch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "René Moser", email = "mail@renemoser.net" }]
keywords = ["cloudscale", "cli", "cloud", "iaas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.0.0",
    "cloudscale-sdk>=0.7.0",
    "jmespath",
    "natsort",
    "pygments",
    "tabulate",
    "yaspin",
]

[project.urls]
Homepage = "https://github.com/cloudscale-ch/cloudscale-cli"
Documentation = "https://cloudscale-ch.github.io/cloudscale-cli"
Changelog = "https://github.com/cloudscale-ch/cloudscale-cli/blob/master/CHANGELOG.md"

[project.scripts]
cloudscale = "cloudscale_cli.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.14",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]

[tool.hatch.version]
path = "cloudscale_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cloudscale_cli"]

[tool.hatch.build.targets.sdist]
include = ["cloudscale_cli", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=cloudscale_cli --cov-report=term-missing"

[tool.coverage.run]
source = ["cloudscale_cli"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "RUF", # ruff specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
